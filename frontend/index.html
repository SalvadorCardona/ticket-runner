<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ticket-runner</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#127915;</text></svg>">
<script>
  /* Before the first paint, or the console flashes white on the way to dark.
     Dark is the default because the console it replaces had no other. */
  try {
    var kept = localStorage.getItem("ticket-runner-theme");
    document.documentElement.classList.toggle("dark", kept !== "light");
  } catch (error) { /* a browser with storage switched off still gets dark */ }
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
