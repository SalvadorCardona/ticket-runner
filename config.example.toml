# ticket-runner — configuration
#
#   ~/.config/ticket-runner/config.toml
#
# Après toute modification :  ticket-runner doctor

[notion]
# Jeton d'une intégration interne Notion (https://www.notion.so/my-integrations).
# La base de tickets ET la base de projets doivent être partagées avec elle :
# menu ··· de la base → Connexions → votre intégration.
token = "ntn_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# L'URL de la base de tickets suffit, l'ID est extrait tout seul.
tickets_database = ""

# Renommez ici si vos colonnes Notion portent d'autres noms.
# Une propriété absente de la base est simplement ignorée.
[notion.properties]
status = "Status"
project = "Project"
agent = "Agent"
pull_request = "Pull Request"
session = "Session"

# Les quatre états qui font tourner le système.
#   ready   ce que le runner prend en charge — à vous d'y mettre un ticket
#           quand sa description est assez précise pour être traitée seule
#   running réservé, travail en cours (empêche un second tour de le reprendre)
#   done    branche poussée, pull request ouverte, à relire
#   failed  échec ou ticket trop ambigu : la raison est en commentaire
[notion.status]
ready = "Not started"
running = "In progress"
done = "Done"
failed = "Draft"

[runner]
# Où chercher les dépôts. Le runner y repère les projets par leur remote origin.
workspace_root = "~/workspace"

# Tickets menés de front en un tour. Chacun coûte une session Claude complète.
max_concurrent = 2

# Au-delà, la session est tuée et le ticket repart en échec.
timeout_minutes = 30

# Vide = le modèle par défaut du CLI. Sinon "opus", "sonnet", "haiku"…
model = ""

# Une session sans personne pour répondre ne peut pas demander d'autorisation.
# Le travail a lieu dans un worktree jetable, jamais dans votre copie de travail.
# Mettez "acceptEdits" pour interdire les commandes shell non approuvées — au
# prix de sessions qui se bloquent dès qu'un test doit être lancé.
permission_mode = "bypassPermissions"

branch_prefix = "ticket/"

# Vide = la branche par défaut du dépôt (origin/HEAD, sinon main puis master).
base_branch = ""

fetch = true            # git fetch avant de créer la branche
push = true             # pousser la branche une fois les commits faits
open_pull_request = true  # gh pr create — jamais de fusion automatique

# Un échec laisse son worktree en place pour l'autopsie.
#   ticket-runner clean --force  pour faire le ménage
keep_worktree_on_failure = true

dry_run = false

# Gabarit de prompt maison. Vide = celui du runner, qui convient au cas général.
prompt_file = ""

# Projets dont le dépôt ne se devine pas : nom exact dans Notion = chemin local.
# Sans entrée ici, le runner rapproche la propriété `github` du projet des
# remotes trouvés sous workspace_root.
[projects]
# "Trader Ia" = "~/workspace/labo/trader-ia"
