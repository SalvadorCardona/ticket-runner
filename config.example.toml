# ticket-runner — configuration
#
#   ~/.config/ticket-runner/config.toml
#
# After any change:  ticket-runner doctor

[notion]
# Token of an internal Notion integration (https://www.notion.so/my-integrations).
# The workspace page must be shared with it — everything under it is then
# reachable: the page's ··· menu → Connections → your integration.
token = "ntn_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# The workspace database: one database whose rows are your master pages, each
# holding its own inline database. Name it once, and the runner finds the rest
# by the title of a row — see [notion.pages] below.
#
# You do not have to build any of it by hand:
#
#     ticket-runner init <url-of-a-notion-page>
#
# creates the four databases with their columns, their relations and their
# status options, and writes the line below for you. Share the page with your
# integration first — that is the one step no API can take.
workspace = ""

# Only if you would rather point at one database than share a whole workspace.
# Set, it wins over the workspace's tickets page. The URL is enough — the ID is
# extracted from it — and if it is an inline database, the URL of the page
# holding it works too.
tickets_database = ""

# Which row of the workspace is what, matched on its title, case ignored.
#   tickets   REQUIRED: the page holding your tickets database
#   projects  optional: the page holding your projects database. The runner
#             reaches a project through the ticket's relation, so this only
#             gives `doctor` something to check
#   context   optional: a plain page saying who you are, what you work with,
#             how you like things written. Its text goes into EVERY prompt,
#             before the project's brief and before the ticket — which is what
#             makes a document ticket come back sounding like you rather than
#             like nobody. Keep it to one screen: you pay it on every ticket.
#   agents    optional: the page holding a database of agents. A ticket points
#             at one through its `Agent` column, and that agent's page is the
#             role the session plays — its craft, its rules, its model
#
# Rows created under the older names — "Master Tickets", "Soul" — are still
# found, as long as this table does not name them otherwise. Nothing to rename.
[notion.pages]
tickets = "Tickets"
projects = "Projects"
agents = "Agents"
context = "Context"

# Rename here if your Notion columns are named differently.
# A property that does not exist in the database is simply skipped.
[notion.properties]
status = "Status"
project = "Project"          # relation → your projects database
pull_request = "Pull Request"

# Which machine took the ticket, written as ticket-runner@host. Not the same
# thing as `role` below, which is the craft the session plays.
agent = "Runner"

# Written when the ticket is claimed. As a URL column it becomes a link that
# opens the session; as a text column it holds the bare identifier.
session = "Session"

# All four are optional — a database without them behaves exactly as before.
model = "Model"          # select: pick the model per ticket, over runner.model
priority = "Priority"    # select: Urgent, High, Normal, Low — which one runs first
cost = "Cost"            # number: what the run cost, written back
duration = "Duration"    # number: how long it took, in minutes
role = "Agent"           # relation → your agents database: who handles the ticket

# A date here is a start gate, not a deadline: the ticket is left alone until
# that moment, then picked up on the first pass after it.
due = "Scheduled"

# On the projects database, two columns are read by name, either capitalisation:
#   Repository  the GitHub URL or owner/name — matched against your clones
#   Path        an explicit path, when the repository is not under workspace_root
# A project with neither is a project without code: its tickets become documents.

# The model is picked from the narrowest choice that names one:
#   the ticket's Model, then its agent's Model, then runner.model below.

# The states that drive the whole system. Point them at whatever your board
# calls them — `ticket-runner doctor` checks that each one really exists.
#   ready    what the runner picks up — move a ticket here once its description
#            is precise enough to be handled without you
#   running  claimed, work in progress (stops a second pass from taking it)
#   done     branch pushed, pull request opened, waiting for your review. It is
#            called "In review" and not "Done" because nothing is done: a human
#            has still to look at it
#   failed   something broke: the session, the push, the worktree
#   blocked  the agent could not settle the ticket and asked a question instead
#            of guessing — or the project could not be located. Its own column:
#            "waiting for you" and "something is wrong" are different days
[notion.status]
ready = "Ready"
running = "In progress"
done = "In review"
failed = "Failed"
blocked = "Blocked"

# One column for both is a fine board too — name `failed` and leave `blocked`
# out, and questions land wherever failures do:
#   failed = "Needs you"

[runner]
# Where to look for repositories. Projects are matched by their origin remote.
workspace_root = "~/workspace"

# Seconds between two passes. Changing this takes effect on the next
# `ticket-runner enable`, which rewrites the systemd timer from this value.
# A pass with nothing to do costs one Notion query, so a short interval is
# cheap: 10 means a ticket starts being worked on within ten seconds.
interval_seconds = 1800

# Tickets handled side by side in one run. Each costs a full Claude session.
max_concurrent = 2

# Past this, the session is killed and the ticket goes back as failed.
timeout_minutes = 30

# Empty = the CLI's default model. Otherwise "opus", "sonnet", "haiku"…
model = ""

# A session with nobody to answer cannot ask for permission. The work happens in
# a disposable worktree, never in your working copy. Use "acceptEdits" to forbid
# unapproved shell commands — at the cost of sessions that stall as soon as a
# test needs running.
permission_mode = "bypassPermissions"

branch_prefix = "ticket/"

# Empty = the repository's default branch (origin/HEAD, else main then master).
base_branch = ""

fetch = true              # git fetch before creating the branch
push = true               # push the branch once commits are in
open_pull_request = true  # gh pr create — never an automatic merge

# A failure leaves its worktree in place for the post-mortem.
#   ticket-runner clean --force  to tidy up
keep_worktree_on_failure = true

# Move each finished session's transcript under the project's directory, so it
# appears in `claude --resume` there, beside the sessions you started yourself.
# Without this the session is still resumable by its ID, but it stays filed
# under the disposable worktree it ran in — a directory that no longer exists.
# Tickets with no repository are filed under workspace_root.
attach_sessions = true

# The ssh destination where sessions actually run. Leave empty when the runner
# is on this machine. Set it when the runner lives on a server: the Session link
# then opens the session over ssh from whichever machine you click on, instead
# of looking for a transcript that is not there.
#   session_host = "salva@vps.example.com"
session_host = ""

# One desktop notification per finished ticket. The point of the runner is that
# you are not watching it; without this you discover your pull request tomorrow.
notify = true

# Drop session logs older than this. 0 keeps everything. The Notion comment
# keeps the summary either way, and the transcript lives in ~/.claude/projects.
log_retention_days = 14

dry_run = false

# Your own prompt templates. Empty = the runner's, which fit the general case.
#   prompt_file           tickets on a project that has a repository
#   document_prompt_file  tickets on a project that has none: the agent writes
#                         ANSWER.md and the runner publishes it into the ticket
prompt_file = ""
document_prompt_file = ""

# Projects whose repository cannot be guessed: exact Notion name = local path.
# Without an entry here, the runner matches the project's Repository property
# against the remotes found under workspace_root.
[projects]
# "Trader Ia" = "~/workspace/labo/trader-ia"
